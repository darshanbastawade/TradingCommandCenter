name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      NUGET_XMLDOC_MODE: skip
      ASPNETCORE_ENVIRONMENT: Testing
      LiveTrading__KillSwitchEngaged: "true"
      LiveTrading__AllowDirectOrders: "false"
      Zerodha__AllowLiveFeed: "false"
      Zerodha__AllowLiveOrders: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned SDK
        id: sdk
        shell: bash
        run: echo "version=$(jq -r '.sdk.version' global.json)" >> "$GITHUB_OUTPUT"

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Verify pinned SDK selection
        shell: bash
        run: test "$(dotnet --version)" = "${{ steps.sdk.outputs.version }}"

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/vectorbt/requirements.lock.txt

      - name: Install locked vectorbt worker dependencies
        run: |
          python -m pip install --disable-pip-version-check -r workers/vectorbt/requirements.lock.txt
          python -m pip check

      - name: Compile and smoke-test vectorbt worker
        run: |
          python -m py_compile workers/vectorbt/worker.py workers/vectorbt/parity.py workers/vectorbt/smoke_test.py external/lean/TradingCommandCenterLean/main.py
          python workers/vectorbt/smoke_test.py

      - name: Restore locked .NET dependencies
        run: dotnet restore TradingCommandCenter.sln --locked-mode --disable-parallel -p:RestoreDisableParallel=true -m:1

      - name: Build full solution
        run: dotnet build TradingCommandCenter.sln --configuration Release --no-restore --disable-build-servers -m:1

      - name: Run native/vectorbt parity fixtures
        run: >-
          dotnet test tests/Trading.StrategyValidationTests/Trading.StrategyValidationTests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers -m:1
          --filter FullyQualifiedName~VectorbtStrategyParityTests

      - name: Run complete .NET test suite
        run: >-
          dotnet test TradingCommandCenter.sln
          --configuration Release --no-build --no-restore --disable-build-servers -m:1
          --logger "trx;LogFilePrefix=ci" --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ github.run_id }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
